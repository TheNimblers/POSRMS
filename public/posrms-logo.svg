<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <!-- Stylized plate -->
  <circle cx="88" cy="116" r="40" fill="#fff" opacity="0.95"/>
  <circle cx="88" cy="116" r="24" fill="url(#accent)" opacity="0.25"/>
  <!-- POS terminal -->
  <g transform="translate(128 76)" filter="url(#s)">
    <rect x="-10" y="0" width="84" height="64" rx="10" fill="#0b1220" opacity="0.9"/>
    <rect x="-4" y="6" width="72" height="36" rx="6" fill="#111827"/>
    <rect x="-4" y="46" width="72" height="10" rx="4" fill="url(#accent)"/>
    <g fill="#e5e7eb">
      <rect x="-1" y="10" width="16" height="6" rx="3"/>
      <rect x="19" y="10" width="16" height="6" rx="3"/>
      <rect x="39" y="10" width="16" height="6" rx="3"/>
      <rect x="-1" y="20" width="24" height="6" rx="3"/>
      <rect x="27" y="20" width="28" height="6" rx="3"/>
      <rect x="-1" y="30" width="18" height="6" rx="3"/>
      <rect x="21" y="30" width="34" height="6" rx="3"/>
    </g>
  </g>
  <!-- Brand text -->
  <text x="128" y="230" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="26" font-weight="700" fill="#fff">POSRMS</text>
</svg>
